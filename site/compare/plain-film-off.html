<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>膜: 普通のページ body なし</title>
<link rel="stylesheet" href="./_shared.css">
<style>
/* No library. A normal page, scrolled to the middle by hand, so the bars sit
   over the blue block. Rules out the library as the cause either way. */
/* body is left unpainted */
.block { background: #1d4ed8; min-height: 300vh; }
.screen { position: sticky; top: 30vh; }
</style>
</head>
<body>
<div class="block">
  <section class="screen">
    <p class="label">canvas film / no library</p>
    <h1>普通のページ / body なし</h1>
    <p class="note">真ん中あたりまでスクロールして、バーの色を見る。</p>
    <pre class="readout" id="readout">…</pre>
  </section>
</div>
<script>
const readout = document.getElementById('readout')
const update = () => {
  readout.textContent = `scrollY: ${Math.round(window.scrollY)}\nbody: ${getComputedStyle(document.body).backgroundColor}`
}
window.addEventListener('scroll', update, { passive: true })
update()
</script>
</body>
</html>
