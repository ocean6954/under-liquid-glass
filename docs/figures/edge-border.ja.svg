<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" width="1180" height="460" role="img"
     aria-label="枠線なし、枠線を色付きにした状態、透明にした状態の3つを並べた図。">
  <rect width="1180" height="460" fill="#fbfbfd"/>
  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, -apple-system, BlinkMacSystemFont, sans-serif" fill="#16181d">
    <text x="80" y="46" font-size="14.5" font-weight="600">1. 枠線なし</text>
    <text x="80" y="68" font-size="12" fill="#6b7280">帯には何も無く、単色になる</text>
    <clipPath id="c80"><rect x="80" y="96" width="230" height="334" rx="14"/></clipPath>
    <g clip-path="url(#c80)">
      <rect x="80" y="96" width="230" height="334" fill="#ffffff"/>
      <rect x="80" y="156" width="230" height="274" fill="#a8c8ea"/>
      <rect x="80" y="96" width="230" height="60" fill="#ffffff"/>
      <rect x="102" y="184" width="150" height="13" rx="3" fill="#2b3a4a" fill-opacity="0.85"/>
      <rect x="102" y="208" width="186" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="102" y="224" width="168" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="102" y="240" width="120" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="102" y="268" width="186" height="104" rx="6" fill="#2b3a4a" fill-opacity="0.18"/>
      <text x="195" y="326" font-size="11.5" fill="#2b3a4a" fill-opacity="0.75" text-anchor="middle">画像</text>
    </g>
    <line x1="80" y1="156" x2="310" y2="156" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="80" y="96" width="230" height="334" rx="14" fill="none" stroke="#16181d" stroke-width="1.8"/>
<text x="96" y="130" font-size="11.5" fill="#94a3b8">何も無い</text>
    <text x="470" y="46" font-size="14.5" font-weight="600">2. 枠線を色付きにすると</text>
    <text x="470" y="68" font-size="12" fill="#6b7280">太さ edge の枠線が帯を占める</text>
    <clipPath id="c470"><rect x="470" y="96" width="230" height="334" rx="14"/></clipPath>
    <g clip-path="url(#c470)">
      <rect x="470" y="96" width="230" height="334" fill="#ffffff"/>
      <rect x="470" y="156" width="230" height="274" fill="#a8c8ea"/>
      <rect x="470" y="96" width="230" height="60" fill="#e0902f"/>
      <rect x="492" y="184" width="150" height="13" rx="3" fill="#2b3a4a" fill-opacity="0.85"/>
      <rect x="492" y="208" width="186" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="492" y="224" width="168" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="492" y="240" width="120" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="492" y="268" width="186" height="104" rx="6" fill="#2b3a4a" fill-opacity="0.18"/>
      <text x="585" y="326" font-size="11.5" fill="#2b3a4a" fill-opacity="0.75" text-anchor="middle">画像</text>
    </g>
    <line x1="470" y1="156" x2="700" y2="156" stroke="#e0902f" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="470" y="96" width="230" height="334" rx="14" fill="none" stroke="#16181d" stroke-width="1.8"/>
<text x="486" y="130" font-size="11.5" fill="#ffffff">枠線</text>
    <text x="860" y="46" font-size="14.5" font-weight="600">3. 透明にすると</text>
    <text x="860" y="68" font-size="12" fill="#6b7280">枠線は消え、背景だけが残る</text>
    <clipPath id="c860"><rect x="860" y="96" width="230" height="334" rx="14"/></clipPath>
    <g clip-path="url(#c860)">
      <rect x="860" y="96" width="230" height="334" fill="#ffffff"/>
      <rect x="860" y="156" width="230" height="274" fill="#a8c8ea"/>
      <rect x="860" y="96" width="230" height="60" fill="#a8c8ea"/>
      <rect x="882" y="184" width="150" height="13" rx="3" fill="#2b3a4a" fill-opacity="0.85"/>
      <rect x="882" y="208" width="186" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="882" y="224" width="168" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="882" y="240" width="120" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="882" y="268" width="186" height="104" rx="6" fill="#2b3a4a" fill-opacity="0.18"/>
      <text x="975" y="326" font-size="11.5" fill="#2b3a4a" fill-opacity="0.75" text-anchor="middle">画像</text>
    </g>
    <line x1="860" y1="156" x2="1090" y2="156" stroke="#e0902f" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="860" y="96" width="230" height="334" rx="14" fill="none" stroke="#16181d" stroke-width="1.8"/>
<text x="876" y="130" font-size="11.5" fill="#42607f">背景が見える</text>

    <g stroke="#e0902f" stroke-width="1.4">
      <line x1="446" y1="96" x2="462" y2="96"/>
      <line x1="446" y1="156" x2="462" y2="156"/>
      <line x1="454" y1="96" x2="454" y2="156"/>
    </g>
    <text x="438" y="130" font-size="11.5" fill="#a25b12" text-anchor="end">edge</text>

    <line x1="80" y1="178" x2="1090" y2="178" stroke="#0d9488" stroke-width="1" stroke-dasharray="5 4" opacity="0.4"/>
    <text x="390" y="172" font-size="11" fill="#0d9488" text-anchor="middle">中身の位置は3つとも同じ</text>
  </g>
</svg>
