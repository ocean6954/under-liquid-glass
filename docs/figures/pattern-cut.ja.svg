<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img"
     aria-label="左: 模様の背景がバーの位置で途切れる。右: 模様がバーの裏まで続く。">
  <defs>
    <pattern id="clover" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#e8f3ec"/>
      <g transform="translate(14,14)" fill="#3f9d78">
        <circle cx="-5" cy="-5" r="5.4"/><circle cx="5" cy="-5" r="5.4"/>
        <circle cx="-5" cy="5" r="5.4"/><circle cx="5" cy="5" r="5.4"/>
      </g>
      <g transform="translate(42,42)" fill="#67b894">
        <circle cx="-5" cy="-5" r="5.4"/><circle cx="5" cy="-5" r="5.4"/>
        <circle cx="-5" cy="5" r="5.4"/><circle cx="5" cy="5" r="5.4"/>
      </g>
    </pattern>
    <clipPath id="phoneA"><rect x="70" y="120" width="230" height="372" rx="18"/></clipPath>
    <clipPath id="phoneB"><rect x="450" y="120" width="230" height="372" rx="18"/></clipPath>
  </defs>

  <rect width="760" height="520" fill="#fbfbfd"/>
  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, -apple-system, BlinkMacSystemFont, sans-serif" fill="#16181d">

    <text x="70" y="58" font-size="15" font-weight="600">よくある状態</text>
    <text x="70" y="80" font-size="12.5" fill="#6b7280">バーの位置で模様が途切れる</text>

    <g clip-path="url(#phoneA)">
      <rect x="70" y="120" width="230" height="372" fill="#ffffff"/>
      <rect x="70" y="156" width="230" height="300" fill="url(#clover)"/>
    </g>
    <g clip-path="url(#phoneA)">
      <rect x="70" y="120" width="230" height="36" fill="#8fa0b5" fill-opacity="0.3"/>
      <rect x="70" y="456" width="230" height="36" fill="#8fa0b5" fill-opacity="0.3"/>
    </g>
    <line x1="70" y1="156" x2="300" y2="156" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="4 3"/>
    <line x1="70" y1="456" x2="300" y2="456" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="70" y="120" width="230" height="372" rx="18" fill="none" stroke="#16181d" stroke-width="2"/>
    <text x="312" y="142" font-size="12" fill="#b91c1c">模様はここまで。</text>
    <text x="312" y="158" font-size="12" fill="#b91c1c">上下は単色になる</text>

    <text x="450" y="58" font-size="15" font-weight="600">やりたかった状態</text>
    <text x="450" y="80" font-size="12.5" fill="#6b7280">模様がバーの裏まで続く</text>

    <g clip-path="url(#phoneB)">
      <rect x="450" y="120" width="230" height="372" fill="url(#clover)"/>
    </g>
    <g clip-path="url(#phoneB)">
      <rect x="450" y="120" width="230" height="36" fill="#8fa0b5" fill-opacity="0.3"/>
      <rect x="450" y="456" width="230" height="36" fill="#8fa0b5" fill-opacity="0.3"/>
    </g>
    <rect x="450" y="120" width="230" height="372" rx="18" fill="none" stroke="#16181d" stroke-width="2"/>
  </g>
</svg>
