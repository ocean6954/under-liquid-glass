<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#a8c8ea"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e0902f" stroke-width="1.6" stroke-opacity="0.85"/>
    </pattern>
    <clipPath id="frame"><rect x="130" y="100" width="300" height="400" rx="16"/></clipPath>
  </defs>
  <rect width="820" height="560" fill="#fbfbfd"/>
  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, -apple-system, BlinkMacSystemFont, sans-serif" fill="#16181d">
    <text x="130" y="52" font-size="15" font-weight="600">先頭セクションの背景を帯まで届かせる</text>
    <text x="130" y="74" font-size="12" fill="#6b7280">親（.page）の padding で、セクションは edge 分下から始まっている</text>

    <g clip-path="url(#frame)">
      <rect x="130" y="100" width="300" height="400" fill="#ffffff"/>
      <rect x="130" y="160" width="300" height="520" fill="#a8c8ea"/>
      <rect x="154" y="188" width="170" height="13" rx="3" fill="#2b3a4a" fill-opacity="0.85"/>
      <rect x="154" y="212" width="230" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="154" y="228" width="206" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="154" y="244" width="150" height="8" rx="3" fill="#2b3a4a" fill-opacity="0.4"/>
      <rect x="154" y="272" width="252" height="120" rx="6" fill="#2b3a4a" fill-opacity="0.18"/>
      <text x="280.0" y="338" font-size="11.5" fill="#2b3a4a" fill-opacity="0.75" text-anchor="middle">画像</text>
      <text x="146" y="134" font-size="11.5" fill="#94a3b8">何も無い</text>
    </g>
    <g stroke="#b91c1c" stroke-width="1.4">
      <line x1="106" y1="100" x2="122" y2="100"/><line x1="106" y1="160" x2="122" y2="160"/>
      <line x1="114" y1="100" x2="114" y2="160"/>
    </g>
    <text x="100" y="134.0" font-size="11.5" fill="#b91c1c" text-anchor="end">帯</text>
    <line x1="130" y1="160" x2="430" y2="160" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>
    <rect x="130" y="100" width="300" height="400" rx="16" fill="none" stroke="#16181d" stroke-width="1.8"/>

    <line x1="122" y1="188" x2="430" y2="188" stroke="#0d9488" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="116" y="192" font-size="11" fill="#0d9488" text-anchor="end">中身の元の位置</text>

    <text x="470" y="140" font-size="14" font-weight="600">1. そのまま</text>
    <text x="470" y="164" font-size="12.5" fill="#6b7280">帯には何も無く、キャンバスの色が出る。</text><text x="470" y="183" font-size="12.5" fill="#6b7280">中身は帯の下から始まっている。</text>
    <rect x="470" y="256" width="300" height="78" rx="8" fill="#f1f5f9"/>
    <text x="486" y="284" font-size="12.5" font-family="Menlo, monospace" fill="#94a3b8">border-block-start: 0px</text>
    <text x="486" y="312" font-size="12.5" font-family="Menlo, monospace" fill="#94a3b8">margin-block-start: 0</text>
  </g>
</svg>