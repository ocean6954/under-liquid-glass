    <clipPath id="clip80"><rect x="80" y="140" width="230" height="372" rx="18"/></clipPath>
    
    <g clip-path="url(#clip80)">
      <rect x="80" y="140" width="230" height="372" fill="#ffffff"/>
      <rect x="80" y="176" width="230" height="372" fill="#a8c8ea"/>
