<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570" role="img"
     aria-label="The backdrop is one layer covering both bands; the surface contributes nothing where the bands are, so the backdrop shows through behind the bars.">
  <defs>
    <pattern id="empty" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fdf2e2"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e0902f" stroke-width="1.4"/>
    </pattern>
    <marker id="plus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/>
    </marker>
    <clipPath id="phone"><rect x="700" y="146" width="200" height="348" rx="18"/></clipPath>
  </defs>

  <rect width="980" height="570" fill="#fbfbfd"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif" fill="#16181d">

    <!-- 1. backdrop -->
    <text x="80" y="58" font-size="15" font-weight="600">[data-ulg-backdrop]</text>
    <text x="80" y="78" font-size="12.5" fill="#6b7280">One layer, 100svh + edgeSpace × 2,</text>
    <text x="80" y="95" font-size="12.5" fill="#6b7280">stuck to the scrollport.</text>
    <rect x="80" y="122" width="200" height="420" fill="#7fa9d9"/>
    <rect x="80" y="122" width="200" height="420" fill="none" stroke="#16181d" stroke-width="1.5"/>
    <line x1="80" y1="182" x2="280" y2="182" stroke="#1e3a5f" stroke-width="1.6" stroke-dasharray="6 4" stroke-opacity="0.85"/>
    <line x1="80" y1="482" x2="280" y2="482" stroke="#1e3a5f" stroke-width="1.6" stroke-dasharray="6 4" stroke-opacity="0.85"/>
    <text x="92" y="148" font-size="11.5" fill="#1e3a5f" font-weight="600">top band</text>
    <text x="92" y="508" font-size="11.5" fill="#1e3a5f" font-weight="600">bottom band</text>

    <!-- 2. surface -->
    <text x="380" y="58" font-size="15" font-weight="600">[data-ulg-surface]</text>
    <text x="380" y="78" font-size="12.5" fill="#6b7280">Same box, but the bands are its</text>
    <text x="380" y="95" font-size="12.5" fill="#6b7280">padding: nothing is painted there.</text>
    <rect x="380" y="122" width="200" height="60" fill="url(#empty)"/>
    <rect x="380" y="182" width="200" height="300" fill="#e6ebf2"/>
    <rect x="380" y="482" width="200" height="60" fill="url(#empty)"/>
    <rect x="380" y="122" width="200" height="420" fill="none" stroke="#16181d" stroke-width="1.5"/>
    <rect x="404" y="418" width="140" height="12" rx="3" fill="#94a3b8"/>
    <rect x="404" y="438" width="104" height="12" rx="3" fill="#b6c2d1"/>
    <text x="392" y="148" font-size="11.5" fill="#a25b12">transparent</text>
    <text x="392" y="508" font-size="11.5" fill="#a25b12">transparent</text>

    <line x1="300" y1="332" x2="360" y2="332" stroke="#0d9488" stroke-width="2.5" marker-end="url(#plus)"/>
    <line x1="600" y1="332" x2="660" y2="332" stroke="#0d9488" stroke-width="2.5" marker-end="url(#plus)"/>

    <!-- 3. what the device shows -->
    <text x="700" y="58" font-size="15" font-weight="600">on screen</text>
    <text x="700" y="78" font-size="12.5" fill="#6b7280">The bars show the backdrop,</text>
    <text x="700" y="95" font-size="12.5" fill="#6b7280">the content sits between them.</text>
    <g clip-path="url(#phone)">
      <rect x="700" y="146" width="200" height="348" fill="#7fa9d9"/>
      <rect x="700" y="182" width="200" height="276" fill="#e6ebf2" fill-opacity="0.92"/>
      <rect x="724" y="404" width="140" height="12" rx="3" fill="#94a3b8"/>
      <rect x="724" y="424" width="104" height="12" rx="3" fill="#b6c2d1"/>
    </g>
    <rect x="700" y="146" width="200" height="36" fill="#8fa0b5" fill-opacity="0.3"/>
    <rect x="700" y="458" width="200" height="36" fill="#8fa0b5" fill-opacity="0.3"/>
    <rect x="700" y="146" width="200" height="348" rx="18" fill="none" stroke="#16181d" stroke-width="2"/>
  </g>
</svg>
